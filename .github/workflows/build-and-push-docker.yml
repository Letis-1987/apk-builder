name: Build and Push Docker Image (Manual)

on:
  # Запуск только вручную через вкладку Actions
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Переводим имя пользователя и репозитория в нижний регистр, 
      # так как GHCR запрещает использовать заглавные буквы в тегах образов
      - name: Convert repository to lowercase
        id: string
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          echo "image_name_lowercase=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Авторизация в GitHub Packages с использованием встроенного токена
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Сборка и отправка образа в ваш репозиторий на GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.string.outputs.image_name_lowercase }}:latest
          # Кэширование сборки, чтобы в будущем (при изменении Dockerfile) всё собиралось быстрее
          cache-from: type=gha
          cache-to: type=gha,mode=max
